<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --jade: #00A86B;
    --jade-deep: #006A4E;
    --mint: #A8E6CF;
    --mint-grey: #CFE3DA;
    --header-grey: #D4D6D5;
    --side-grey: #F1F2F1;
    --main-bg: #FAFAF7;
    --ink: #2B3A34;
    --line: #C9CDCB;
    --card: #FFFFFF;
    --chip-border: #BFE3D2;
    --user-bubble: #A8E6CF;
    --user-ink: #04372A;
    --silhouette: #111111;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --header-grey: #3A3D3C; --side-grey: #2A2C2B; --main-bg: #1D1F1E;
      --ink: #E6EEEA; --line: #454947; --card: #262827; --chip-border: #2F5A4A;
      --mint-grey: #3D5A4E; --silhouette: #E6EEEA;
    }
  }
  :root[data-theme="dark"] {
    --header-grey: #3A3D3C; --side-grey: #2A2C2B; --main-bg: #1D1F1E;
    --ink: #E6EEEA; --line: #454947; --card: #262827; --chip-border: #2F5A4A;
    --mint-grey: #3D5A4E; --silhouette: #E6EEEA;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    background: var(--main-bg); color: var(--ink);
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--jade-deep); outline-offset: 2px; }

  .app { display: flex; height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 272px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0;
    background: var(--side-grey); border-right: 1px solid var(--line);
  }
  .brand { background: var(--header-grey); padding: 18px 22px 16px; min-height: 104px; margin: 0; }
  .logo-btn {
    display: block; width: 100%; padding: 0; margin: 0; border: 0; background: transparent;
    text-align: left; color: inherit;
  }
  .logo {
    display: flex; align-items: flex-end;
    font-family: "Baloo 2", "Fredoka", sans-serif; font-weight: 800;
    font-size: 54px; line-height: 1; letter-spacing: 1px;
    color: #fff;
    -webkit-text-stroke: 3px var(--jade-deep);
    paint-order: stroke fill;
    text-shadow: 0 3px 0 var(--jade-deep);
  }
  .logo .i-wrap { position: relative; display: inline-block; }
  .logo .smiley { position: absolute; left: 50%; top: -2px; width: 26px; height: 26px; transform: translateX(-50%); }
  .tagline { display: block; margin: 6px 0 0 3px; font-size: 14px; font-weight: 500; color: var(--jade); letter-spacing: .3px; }

  .nav { padding: 16px 14px 0; display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 11px 14px; border: 0; border-radius: 14px; background: transparent;
    font-size: 17px; font-weight: 500; color: var(--ink); text-align: left;
  }
  .nav-item:hover, .nav-item.active { background: var(--mint-grey); }
  .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; color: var(--jade-deep); }

  .section-label { margin: 22px 28px 6px; font-size: 14px; font-weight: 600; color: var(--jade-deep); }
  .chats { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 10px; display: flex; flex-direction: column; gap: 4px; }
  .chat-row { position: relative; }
  .chat-item {
    display: block; width: 100%; padding: 10px 40px 10px 14px; border: 0; border-radius: 12px;
    background: transparent; font-size: 16px; color: var(--ink); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item:hover { background: var(--mint-grey); }
  .chat-row.active .chat-item { background: var(--mint-grey); font-weight: 500; }
  .chat-del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent;
    color: var(--jade-deep); font-size: 18px; line-height: 1; opacity: 0;
  }
  .chat-row:hover .chat-del, .chat-del:focus-visible { opacity: 1; }
  .chat-del:hover { background: var(--card); }
  @media (hover: none) { .chat-del { opacity: .6; } }

  /* Advertise dropdown */
  .advertise { margin: 0 14px 10px; }
  .advertise summary {
    list-style: none; display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 14px; cursor: pointer;
    font-size: 16px; font-weight: 500; color: var(--ink);
  }
  .advertise summary::-webkit-details-marker { display: none; }
  .advertise summary:hover { background: var(--mint-grey); }
  .advertise summary svg { width: 22px; height: 22px; color: var(--jade-deep); flex-shrink: 0; }
  .advertise summary .chev { margin-left: auto; width: 16px; height: 16px; transition: transform .2s; }
  .advertise[open] summary .chev { transform: rotate(180deg); }
  .advertise .drop { padding: 6px 14px 4px 48px; font-size: 14px; line-height: 1.4; }
  .advertise .drop a { color: var(--jade-deep); font-weight: 500; overflow-wrap: anywhere; }
  .divider { height: 0; border: 0; border-top: 2px solid var(--line); margin: 0 18px; }

  .account { display: flex; align-items: center; gap: 12px; padding: 14px 18px 18px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: var(--mint-grey);
    color: var(--jade); display: grid; place-items: center;
    font-weight: 700; font-size: 22px; flex-shrink: 0;
  }
  .account-name { font-size: 16px; font-weight: 500; flex: 1; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; position: relative; display: flex; justify-content: center; align-items: center; padding: 24px; }
  .signin {
    position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 22px;
    padding: 10px 26px; border: 0; border-radius: 999px;
    background: var(--mint); color: var(--jade-deep);
    font-size: 17px; font-weight: 600; z-index: 2;
  }
  .signin:hover { background: #8fdcbc; }

  .center { width: 100%; max-width: 760px; text-align: center; display: flex; flex-direction: column; }
  .greeting {
    margin: 0 0 34px; color: var(--jade);
    font-size: clamp(34px, 5.2vw, 58px); font-weight: 600; line-height: 1.15; letter-spacing: .3px;
  }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 38px; }
  .chip {
    padding: 11px 24px; border-radius: 999px; border: 2px solid var(--chip-border);
    background: var(--card); color: var(--jade-deep); font-size: 17px; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .chip:hover { background: var(--mint); border-color: var(--mint); }

  .messages { display: none; flex: 1; overflow-y: auto; padding: 56px 4px 16px; text-align: left; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 86%; align-items: flex-end; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.piya { align-self: flex-start; }
  .bubble { padding: 12px 18px; border-radius: 22px; font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
  .bubble.plain, .bubble .txt { white-space: pre-wrap; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-ink); border-bottom-right-radius: 6px; }
  .msg.piya .bubble { background: var(--card); border: 2px solid var(--chip-border); border-bottom-left-radius: 6px; }
  .msg.piya .bubble.error { border-color: #E3B9B9; }
  .mini { width: 32px; height: 32px; flex-shrink: 0; }

  /* remedy tick boxes inside Piya's replies */
  .remedy-list { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .remedy-list label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .remedy-list input[type="checkbox"], .remedy-card input[type="checkbox"] {
    width: 20px; height: 20px; margin: 3px 0 0; flex-shrink: 0; accent-color: var(--jade-deep); cursor: pointer;
  }
  .tick-hint { font-size: 14px; color: var(--jade-deep); margin-top: 6px; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); opacity: .35; animation: blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }

  .main.chatting { align-items: stretch; padding-bottom: 18px; }
  .main.chatting .center { height: 100%; }
  .main.chatting .greeting, .main.chatting .chips { display: none; }
  .main.chatting .messages { display: flex; }

  .searchbox {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 2px solid var(--chip-border);
    border-radius: 999px; padding: 8px 8px 8px 26px;
  }
  .searchbox:focus-within { border-color: var(--jade); }
  .searchbox input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-family: inherit; font-size: 18px; color: var(--ink); padding: 10px 0;
  }
  .searchbox input::placeholder { color: #8a9a93; }
  .send { width: 52px; height: 52px; border: 0; padding: 0; border-radius: 50%; background: transparent; flex-shrink: 0; transition: transform .15s; }
  .send:hover { transform: scale(1.08) rotate(-6deg); }
  .send:disabled { opacity: .5; cursor: wait; transform: none; }
  .send svg { width: 100%; height: 100%; display: block; }

  /* ---------- Remedies page ---------- */
  .remedies-view { display: none; width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; text-align: center; padding: 56px 4px 16px; }
  .main.view-remedies .center { display: none; }
  .main.view-remedies .remedies-view { display: block; }
  .main.view-remedies { align-items: center; }
  .empty-state svg { width: min(260px, 60vw); height: auto; color: var(--silhouette); }
  .empty-state h2 { margin: 18px 0 6px; font-size: clamp(28px, 4vw, 40px); font-weight: 600; color: var(--jade); }
  .empty-state p { margin: 0; font-size: 17px; color: var(--ink); opacity: .75; }
  .remedies-view h2.title { margin: 0 0 22px; font-size: clamp(28px, 4vw, 40px); font-weight: 600; color: var(--jade); }
  .remedy-cards { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .remedy-card {
    display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; cursor: pointer;
    background: var(--card); border: 2px solid var(--chip-border); border-radius: 22px;
    font-size: 17px; line-height: 1.45;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    background: var(--jade-deep); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }


  /* ---------- Sign in dialog ---------- */
  .auth-overlay {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    padding: 20px; background: rgba(20, 40, 32, .45);
  }
  .auth-overlay.open { display: flex; }
  .auth-card {
    position: relative; width: 100%; max-width: 400px; background: var(--card); color: var(--ink);
    border-radius: 28px; padding: 28px 26px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .auth-close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: transparent; color: var(--jade-deep); font-size: 22px; line-height: 1;
  }
  .auth-close:hover { background: var(--mint-grey); }
  .auth-card h2 { margin: 0 0 4px; font-size: 28px; font-weight: 600; color: var(--jade); }
  .auth-card .sub { margin: 0 0 18px; font-size: 15px; opacity: .75; }
  .auth-tabs { display: flex; gap: 6px; background: var(--side-grey); padding: 4px; border-radius: 999px; margin-bottom: 18px; }
  .auth-tabs button {
    flex: 1; padding: 9px 12px; border: 0; border-radius: 999px; background: transparent;
    font-size: 16px; font-weight: 500; color: var(--ink);
  }
  .auth-tabs button.active { background: var(--mint); color: var(--jade-deep); }
  .auth-card label { display: block; margin: 0 0 12px; font-size: 14px; font-weight: 500; }
  .auth-card input {
    display: block; width: 100%; margin-top: 5px; padding: 12px 16px; font-family: inherit; font-size: 16px;
    color: var(--ink); background: var(--main-bg); border: 2px solid var(--chip-border); border-radius: 16px; outline: 0;
  }
  .auth-card input:focus { border-color: var(--jade); }
  .auth-submit {
    width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 999px;
    background: var(--jade-deep); color: #fff; font-size: 17px; font-weight: 600;
  }
  .auth-submit:disabled { opacity: .6; cursor: wait; }
  .auth-msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; line-height: 1.4; }
  .auth-msg.error { color: #B3261E; }
  .auth-msg.ok { color: var(--jade-deep); }

  .menu-toggle { display: none; }

  @media (max-width: 820px) {
    .sidebar { position: fixed; z-index: 10; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .25s; padding-top: env(safe-area-inset-top, 0px); }
    .sidebar.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
    .menu-toggle {
      display: grid; place-items: center; position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 18px;
      width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--mint-grey); color: var(--jade-deep); z-index: 2;
    }
    .menu-toggle svg { width: 22px; height: 22px; }
    .msg { max-width: 94%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <h1 class="brand">
      <button class="logo-btn" id="logoBtn" aria-label="Piya, go to home page">
        <span class="logo" aria-hidden="true">
          <span>P</span><span class="i-wrap">ı<svg class="smiley" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="#A8E6CF" stroke="#006A4E" stroke-width="3"/>
            <circle cx="11" cy="13" r="2" fill="#006A4E"/><circle cx="21" cy="13" r="2" fill="#006A4E"/>
            <path d="M9.5 18.5c1.5 4 11.5 4 13 0" fill="none" stroke="#006A4E" stroke-width="2.6" stroke-linecap="round"/>
          </svg></span><span>y</span><span>a</span>
        </span>
        <span class="tagline">positivity</span>
      </button>
    </h1>

    <nav class="nav" aria-label="Main">
      <button class="nav-item" id="newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
      <button class="nav-item" id="remediesBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4.2" r="1.8" fill="currentColor"/>
          <path d="M12 7v7.5M12 14.5v6M12 14.5l4-2.2-3.2-2.8M8.5 3.5c1.2 1.5 2.4 2.3 3.5 2.3s2.3-.8 3.5-2.3M12 8.2L8.6 4.6M12 8.2l3.4-3.6"/>
        </svg>
        Remedies
      </button>
    </nav>

    <div class="section-label">Chats</div>
    <div class="chats" id="chatList"></div>

    <details class="advertise">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4l3 .5L13 19V5L6 9.5 3 10zM17 9.5a4 4 0 010 5"/></svg>
        Advertise
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="drop">
        Business enquiries:<br>
        <a href="mailto:jonathansanjay1805@gmail.com">jonathansanjay1805@gmail.com</a>
      </div>
    </details>
    <hr class="divider">
    <div class="account">
      <div class="avatar" id="avatar" aria-hidden="true">N</div>
      <span class="account-name" id="accountName">Not Signed In</span>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main" id="main">
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="signin" id="signinBtn">Sign In</button>

    <div class="center">
      <h2 class="greeting">Hey! How can I assist you today?</h2>

      <div class="chips" id="chips">
        <button class="chip" data-msg="I need some comfort">Comfort</button>
        <button class="chip" data-msg="Make me laugh">Make me Laugh</button>
        <button class="chip" data-msg="Let's have some fun">Fun</button>
        <button class="chip" data-msg="I want to vent">Vent</button>
        <button class="chip" data-msg="I need some motivation">Motivate</button>
        <button class="chip" data-msg="I need help solving a problem">Solve your Problems</button>
        <button class="chip" data-msg="Give me some cooling ideas to calm down">Cooling Ideas</button>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="searchbox">
        <input id="prompt" type="text" placeholder="Message Piya…" aria-label="Message Piya" autocomplete="off" maxlength="2000">
        <button class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="25" fill="#A8E6CF"/>
            <circle cx="18" cy="21" r="3.4" fill="#006A4E"/><circle cx="34" cy="21" r="3.4" fill="#006A4E"/>
            <path d="M14 30c3 9 21 9 24 0" fill="none" stroke="#006A4E" stroke-width="3.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <section class="remedies-view" id="remediesView" aria-label="Remedies"></section>
  </main>
</div>
<div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-card">
    <button class="auth-close" id="authClose" aria-label="Close">&times;</button>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Log in to Piya.</p>
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" class="active">Log in</button>
      <button type="button" role="tab" id="tabSignup">Sign up</button>
    </div>
    <div id="authFields">
      <label id="nameLabel" hidden>Your name
        <input id="authName" type="text" autocomplete="given-name" maxlength="40">
      </label>
      <label>Email
        <input id="authEmail" type="email" autocomplete="email">
      </label>
      <label>Password
        <input id="authPassword" type="password" autocomplete="current-password" minlength="6">
      </label>
      <button type="button" class="auth-submit" id="authSubmit">Log in</button>
      <p class="auth-msg" id="authMsg" role="status"></p>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  // ====== SETTINGS ======
  const API_URL = 'https://piya-kqei.onrender.com/chat';
  const MAX_HISTORY = 6;
  const STORE_KEY = 'piya_state_v1';

  // ====== ELEMENTS ======
  const input = document.getElementById('prompt');
  const sendBtn = document.getElementById('send');
  const messagesEl = document.getElementById('messages');
  const main = document.getElementById('main');
  const sidebar = document.getElementById('sidebar');
  const chatListEl = document.getElementById('chatList');
  const remediesView = document.getElementById('remediesView');
  const remediesBtn = document.getElementById('remediesBtn');
  const toastEl = document.getElementById('toast');

  // ====== SAVED STATE (chats + remedies stay after refresh) ======
  let state = { chats: [], remedies: [], activeId: null };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.chats) && Array.isArray(saved.remedies)) state = saved;
  } catch (_) {}
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) {} }

  let view = 'chat';      // 'chat' or 'remedies'
  let busy = false;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const activeChat = () => state.chats.find(c => c.id === state.activeId);

  // ====== SMALL HELPERS ======
  const MINI_SMILEY = `<svg class="mini" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="#A8E6CF" stroke="#006A4E" stroke-width="2.4"/>
    <circle cx="11" cy="13" r="2" fill="#006A4E"/><circle cx="21" cy="13" r="2" fill="#006A4E"/>
    <path d="M9.5 18.5c1.5 4 11.5 4 13 0" fill="none" stroke="#006A4E" stroke-width="2.4" stroke-linecap="round"/></svg>`;

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // turns **bold** into real bold, safely
  function appendFormatted(parent, text) {
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
      if (!part) return;
      if (i % 2 === 1) { const s = document.createElement('strong'); s.textContent = part; parent.appendChild(s); }
      else parent.appendChild(document.createTextNode(part));
    });
  }

  // ====== REMEDIES ======
  const remedyKey = t => t.replace(/\*\*/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const isSaved = t => state.remedies.some(r => r.key === remedyKey(t));

  function setRemedy(text, on) {
    const key = remedyKey(text);
    state.remedies = state.remedies.filter(r => r.key !== key);
    if (on) state.remedies.push({ key, text });
    save();
    toast(on ? 'Added to Remedies' : 'Removed from Remedies');
  }

  // finds numbered items (1. 2. 3.) in a reply; needs at least 2 to count
  // fixes lists squashed onto one line: "1. Walk, 2. Water, 3. Snack" -> one item per line
  function splitInlineLists(text) {
    return text.split('\n').map(line =>
      /(^|\s)1(?:[.)]\s+|\uFE0F?\u20E3\s*)\S.*\s2(?:[.)]\s+|\uFE0F?\u20E3)/.test(line)
        ? line.replace(/[,;]?\s+(?=\d+[.)]\s|\d\uFE0F?\u20E3)/g, '\n')
        : line
    ).join('\n');
  }

  // finds list items (1. 2. 3. or - / * / • bullets) in a reply; needs at least 2 to count
  function parseReply(text) {
    const intro = [], outro = [], items = [];
    let phase = 'intro', cur = null, pendingBlank = false;
    for (const line of splitInlineLists(text).split('\n')) {
      // item = "1." / "1)" or any bullet/dash look-alike (-, •, ‑ non-breaking hyphen, − minus, – —, etc.)
      let m = line.match(/^\s*(?:(?:\d+[.)]|[-*•·●▪◦‐‑‒–—−])\s+|\d\uFE0F?\u20E3\s*)(.*)$/);
      // or a line that starts with a **Bold Name** followed by a dash or colon
      if (!m) m = line.match(/^\s*(\*\*[^*]+\*\*\s*[–—‐‑−:-]\s*.*)$/);
      if (m) { phase = 'list'; cur = { text: m[1].trim() }; items.push(cur); pendingBlank = false; continue; }
      if (phase === 'intro') { intro.push(line); continue; }
      if (phase === 'list') {
        if (line.trim() === '') { pendingBlank = true; continue; }
        if (/^\s/.test(line) || !pendingBlank) { cur.text += ' ' + line.trim(); }
        else { phase = 'outro'; outro.push(line); }
        continue;
      }
      outro.push(line);
    }
    if (items.length < 2) return null;
    return { intro: intro.join('\n').trim(), items, outro: outro.join('\n').trim() };
  }

  function renderPiyaContent(bubble, text) {
    const parsed = parseReply(text);
    if (!parsed) { bubble.classList.add('plain'); appendFormatted(bubble, text.trim()); return; }

    if (parsed.intro) {
      const d = document.createElement('div'); d.className = 'txt';
      appendFormatted(d, parsed.intro); bubble.appendChild(d);
    }
    const ul = document.createElement('ul'); ul.className = 'remedy-list';
    parsed.items.forEach(item => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isSaved(item.text);
      cb.setAttribute('aria-label', 'Add to Remedies');
      cb.addEventListener('change', () => setRemedy(item.text, cb.checked));
      const span = document.createElement('span');
      appendFormatted(span, item.text);
      label.append(cb, span);
      li.appendChild(label);
      ul.appendChild(li);
    });
    bubble.appendChild(ul);
    if (parsed.outro) {
      const d = document.createElement('div'); d.className = 'txt';
      appendFormatted(d, parsed.outro); bubble.appendChild(d);
    }
    const hint = document.createElement('div');
    hint.className = 'tick-hint';
    hint.textContent = 'Tick anything you like to save it in Remedies';
    bubble.appendChild(hint);
  }

  const YOGA_SILHOUETTE = `<svg viewBox="0 0 200 190" role="img" aria-label="Silhouette of a person doing yoga" fill="currentColor">
    <circle cx="100" cy="42" r="17"/>
    <path d="M83 66 Q100 58 117 66 L122 110 Q100 120 78 110 Z"/>
    <path d="M84 70 Q62 96 50 128 Q57 134 64 128 Q79 104 92 82 Z"/>
    <path d="M116 70 Q138 96 150 128 Q143 134 136 128 Q121 104 108 82 Z"/>
    <path d="M30 152 Q44 120 100 122 Q156 120 170 152 Q158 170 100 164 Q42 170 30 152 Z"/>
    <ellipse cx="62" cy="150" rx="24" ry="11"/><ellipse cx="138" cy="150" rx="24" ry="11"/>
    <circle cx="57" cy="130" r="6"/><circle cx="143" cy="130" r="6"/>
  </svg>`;

  function renderRemedies() {
    remediesView.innerHTML = '';
    if (state.remedies.length === 0) {
      const box = document.createElement('div');
      box.className = 'empty-state';
      box.innerHTML = YOGA_SILHOUETTE + '<h2>No remedies yet</h2><p>Tick a remedy in your chat and it will show up here.</p>';
      remediesView.appendChild(box);
      return;
    }
    const h = document.createElement('h2'); h.className = 'title'; h.textContent = 'Your Remedies';
    const wrap = document.createElement('div'); wrap.className = 'remedy-cards';
    state.remedies.forEach(r => {
      const label = document.createElement('label'); label.className = 'remedy-card';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
      cb.setAttribute('aria-label', 'Remove from Remedies');
      cb.addEventListener('change', () => {
        if (!cb.checked) { setRemedy(r.text, false); renderRemedies(); }
      });
      const span = document.createElement('span'); appendFormatted(span, r.text);
      label.append(cb, span);
      wrap.appendChild(label);
    });
    remediesView.append(h, wrap);
  }

  // ====== CHAT RENDERING ======
  function addMessage(msg) {
    const row = document.createElement('div');
    row.className = 'msg ' + msg.role;
    if (msg.role === 'piya') row.insertAdjacentHTML('beforeend', MINI_SMILEY);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (msg.role === 'user' || msg.error) {
      bubble.classList.add('plain');
      if (msg.error) bubble.classList.add('error');
      bubble.textContent = msg.text;
    } else {
      renderPiyaContent(bubble, msg.text);
    }
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg piya';
    row.insertAdjacentHTML('beforeend', MINI_SMILEY);
    row.insertAdjacentHTML('beforeend', '<div class="bubble"><span class="typing" aria-label="Piya is typing"><i></i><i></i><i></i></span></div>');
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function renderChat() {
    messagesEl.innerHTML = '';
    const chat = activeChat();
    const hasMessages = chat && chat.msgs.length > 0;
    main.classList.toggle('chatting', !!hasMessages);
    if (hasMessages) chat.msgs.forEach(addMessage);
  }

  function renderSidebar() {
    chatListEl.innerHTML = '';
    state.chats.forEach(chat => {
      const row = document.createElement('div');
      row.className = 'chat-row' + (chat.id === state.activeId && view === 'chat' ? ' active' : '');
      const btn = document.createElement('button');
      btn.className = 'chat-item';
      btn.textContent = chat.title;
      btn.title = chat.title;
      btn.addEventListener('click', () => selectChat(chat.id));
      const del = document.createElement('button');
      del.className = 'chat-del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete chat');
      del.addEventListener('click', e => { e.stopPropagation(); deleteChat(chat.id); });
      row.append(btn, del);
      chatListEl.appendChild(row);
    });
    remediesBtn.classList.toggle('active', view === 'remedies');
  }

  function setView(v) {
    view = v;
    main.classList.toggle('view-remedies', v === 'remedies');
    if (v === 'remedies') renderRemedies(); else renderChat();
    renderSidebar();
    sidebar.classList.remove('open');
  }

  // ====== CHAT ACTIONS ======
  function goHome() {
    // reuse an empty chat so we never pile up blank ones; old chats are kept
    let chat = state.chats.find(c => c.msgs.length === 0);
    if (!chat) {
      chat = { id: uid(), title: 'New Chat', msgs: [], history: [] };
      state.chats.unshift(chat);
    }
    state.activeId = chat.id;
    save();
    setView('chat');
    input.value = '';
    input.focus();
  }

  function selectChat(id) {
    state.activeId = id;
    save();
    setView('chat');
  }

  function deleteChat(id) {
    state.chats = state.chats.filter(c => c.id !== id);
    if (state.activeId === id) { state.activeId = null; goHome(); return; }
    save();
    renderSidebar();
  }

  function friendlyError(status, detail) {
    const d = String(detail || '').toLowerCase();
    if (status === 429 || d.includes('rate_limit') || d.includes('rate limit')) {
      return "I need a little rest right now. Please try again in a minute!";
    }
    if (status === 422) return "That message was a bit too long or empty. Can you try again?";
    return "Oops, something went wrong on my side. Please try again!";
  }

  async function sendMessage(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    if (view !== 'chat') setView('chat');
    if (!activeChat()) goHome();

    const chat = activeChat();
    busy = true;
    sendBtn.disabled = true;
    input.value = '';

    if (chat.msgs.length === 0) chat.title = text.length > 24 ? text.slice(0, 24) + '…' : text;
    chat.msgs.push({ role: 'user', text });
    save();
    renderSidebar();
    renderChat();
    const typing = addTyping();

    let reply, isError = false;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, history: chat.history.slice(-MAX_HISTORY) })
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        console.error('Backend error:', res.status, data);
        reply = friendlyError(res.status, JSON.stringify(data));
        isError = true;
      } else {
        reply = data.reply || "Hmm, I got a bit tongue-tied. Can you say that again?";
        chat.history.push({ role: 'user', content: text });
        chat.history.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      console.error(err);
      reply = "I can't reach my brain right now. Is the backend running?";
      isError = true;
    }

    chat.msgs.push({ role: 'piya', text: reply, error: isError });
    save();
    typing.remove();
    if (activeChat() === chat && view === 'chat') addMessage({ role: 'piya', text: reply, error: isError });

    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  // ====== EVENTS ======
  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(input.value); });
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) sendMessage(chip.dataset.msg);
  });
  document.getElementById('newChat').addEventListener('click', goHome);
  document.getElementById('logoBtn').addEventListener('click', goHome);
  remediesBtn.addEventListener('click', () => setView('remedies'));
  document.getElementById('menuToggle').addEventListener('click', () => sidebar.classList.toggle('open'));
  main.addEventListener('click', e => {
    if (!e.target.closest('#menuToggle')) sidebar.classList.remove('open');
  });

  // ====== SIGN IN (Supabase email + password) ======
  // Paste your two values from Supabase: Project Settings -> API
  const SUPABASE_URL = 'https://okxcwtasjvjrvrzpbbjt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cvwPWJnMR4fNs0buHBzo7w_lmLTI3zC';
  const SESSION_KEY = 'piya_session_v1';

  const signinBtn = document.getElementById('signinBtn');
  const avatarEl = document.getElementById('avatar');
  const accountNameEl = document.getElementById('accountName');
  const authOverlay = document.getElementById('authOverlay');
  const authMsg = document.getElementById('authMsg');
  const authSubmit = document.getElementById('authSubmit');
  const authName = document.getElementById('authName');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  let authMode = 'login';
  let session = null;

  const authConfigured = () => !SUPABASE_URL.startsWith('PASTE') && !SUPABASE_ANON_KEY.startsWith('PASTE');

  function saveSession(s) {
    session = s;
    try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (_) {}
  }

  async function authFetch(path, body, token) {
    const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY };
    if (token) headers['Authorization'] = 'Bearer ' + token;   // only a real user token; the public key goes in apikey
    const res = await fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers,
      body: JSON.stringify(body || {})
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data.msg || data.error_description || data.message || 'Something went wrong.');
    return data;
  }

  function sessionFrom(data) {
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      user: data.user
    };
  }

  function displayName(user) {
    const n = user && user.user_metadata && user.user_metadata.name;
    return (n && n.trim()) || (user && user.email ? user.email.split('@')[0] : 'Friend');
  }

  function renderAccount() {
    if (session && session.user) {
      const name = displayName(session.user);
      avatarEl.textContent = name.charAt(0).toUpperCase();
      accountNameEl.textContent = name;
      signinBtn.textContent = 'Sign Out';
    } else {
      avatarEl.textContent = 'N';
      accountNameEl.textContent = 'Not Signed In';
      signinBtn.textContent = 'Sign In';
    }
  }

  function setAuthMode(mode) {
    authMode = mode;
    const signup = mode === 'signup';
    document.getElementById('tabLogin').classList.toggle('active', !signup);
    document.getElementById('tabSignup').classList.toggle('active', signup);
    document.getElementById('nameLabel').hidden = !signup;
    document.getElementById('authTitle').textContent = signup ? 'Join Piya' : 'Welcome back';
    document.getElementById('authSub').textContent = signup ? 'Create your free account.' : 'Log in to Piya.';
    authSubmit.textContent = signup ? 'Create account' : 'Log in';
    authPassword.autocomplete = signup ? 'new-password' : 'current-password';
    showAuthMsg('');
  }

  function showAuthMsg(text, kind) {
    authMsg.textContent = text;
    authMsg.className = 'auth-msg' + (kind ? ' ' + kind : '');
  }

  function openAuth() {
    if (!authConfigured()) { toast("Sign in isn't set up yet"); return; }
    setAuthMode('login');
    authOverlay.classList.add('open');
    authEmail.focus();
  }
  function closeAuth() { authOverlay.classList.remove('open'); authPassword.value = ''; }

  async function submitAuth() {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { showAuthMsg('Please enter your email and password.', 'error'); return; }
    if (authMode === 'signup' && password.length < 6) { showAuthMsg('Your password needs at least 6 characters.', 'error'); return; }

    authSubmit.disabled = true;
    showAuthMsg('One moment…');
    try {
      let data;
      if (authMode === 'signup') {
        data = await authFetch('/auth/v1/signup', { email, password, data: { name: authName.value.trim() } });
        if (!data.access_token) {
          showAuthMsg('Almost there! Check your email and click the link to confirm, then log in.', 'ok');
          return;
        }
      } else {
        data = await authFetch('/auth/v1/token?grant_type=password', { email, password });
      }
      saveSession(sessionFrom(data));
      renderAccount();
      closeAuth();
      toast('Welcome, ' + displayName(session.user) + '!');
    } catch (err) {
      showAuthMsg(err.message, 'error');
    } finally {
      authSubmit.disabled = false;
    }
  }

  async function signOut() {
    const token = session && session.access_token;
    saveSession(null);
    renderAccount();
    toast('Signed out');
    try { if (authConfigured() && token) await authFetch('/auth/v1/logout', {}, token); } catch (_) {}
  }

  async function initAuth() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (_) { session = null; }
    // refresh an expired login quietly
    if (session && authConfigured() && Date.now() > session.expires_at - 60000) {
      try {
        const data = await authFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
        saveSession(sessionFrom(data));
      } catch (_) { saveSession(null); }
    }
    renderAccount();
  }

  signinBtn.addEventListener('click', () => (session ? signOut() : openAuth()));
  document.getElementById('authClose').addEventListener('click', closeAuth);
  authOverlay.addEventListener('click', e => { if (e.target === authOverlay) closeAuth(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAuth(); });
  document.getElementById('tabLogin').addEventListener('click', () => setAuthMode('login'));
  document.getElementById('tabSignup').addEventListener('click', () => setAuthMode('signup'));
  authSubmit.addEventListener('click', submitAuth);
  [authName, authEmail, authPassword].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));

  // ====== START ======
  if (!state.chats.length || !activeChat()) {
    state.activeId = state.chats.length ? state.chats[0].id : null;
  }
  if (!activeChat()) goHome(); else setView('chat');
  initAuth();
</script>
